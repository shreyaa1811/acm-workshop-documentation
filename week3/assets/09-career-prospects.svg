<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510" role="img" aria-labelledby="title desc">
  <title id="title">Career paths in agentic AI</title>
  <desc id="desc">Explore AI application engineering, automation engineering, AI platform engineering and AI evaluation. Shared foundations include Python, APIs, tools, state and evaluation.</desc>
  <rect width="1120" height="510" rx="24" fill="#101c30"/>
  <g font-family="'Times New Roman', Times, serif">
    <text x="48" y="58" fill="#7dd3fc" font-size="16" font-weight="700" letter-spacing="2">AGENTIC AI WORKSHOP</text>
    <text x="48" y="106" fill="white" font-size="34" font-weight="700">Where these skills can take you</text>
    <text x="48" y="140" fill="#b7c8df" font-size="18">Career directions to explore as you build experience</text>
    <g fill="#1d304c" stroke="#35506f">
      <rect x="48" y="176" width="500" height="108" rx="12"/>
      <rect x="572" y="176" width="500" height="108" rx="12"/>
      <rect x="48" y="302" width="500" height="108" rx="12"/>
      <rect x="572" y="302" width="500" height="108" rx="12"/>
    </g>
    <g fill="white" font-size="22" font-weight="700">
      <text x="68" y="207">AI application engineer</text>
      <text x="592" y="207">Automation engineer</text>
      <text x="68" y="333">AI platform engineer</text>
      <text x="592" y="333">AI evaluation engineer</text>
    </g>
    <g fill="#c5d4e8" font-size="17">
      <text x="68" y="235">Build AI-powered products</text>
      <text x="592" y="235">Connect processes and services</text>
      <text x="68" y="361">Deploy and maintain AI systems</text>
      <text x="592" y="361">Test quality and failure cases</text>
    </g>
    <g fill="#7dd3fc" font-size="16">
      <text x="68" y="261">LLM APIs, tools, application design</text>
      <text x="592" y="261">APIs, workflow design, integrations</text>
      <text x="68" y="387">Deployment, monitoring, reliability</text>
      <text x="592" y="387">Test datasets, metrics, safety checks</text>
    </g>
    <text x="48" y="452" fill="white" font-size="17">Shared foundations: Python / APIs / tool use / state / evaluation</text>
    <text x="48" y="480" fill="#b7c8df" font-size="14">Titles vary by organisation. Build broader software, data and domain knowledge alongside these skills.</text>
  </g>
</svg>
