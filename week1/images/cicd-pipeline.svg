<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-label="CI/CD pipeline: source, build, test, package, deploy">
<title>CI/CD pipeline: source, build, test, package, deploy</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
  </marker>
</defs>
<rect x="1" y="1" width="958" height="258" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
<g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" fill="#0f172a">
<text x="32" y="46" font-size="22" font-weight="bold" fill="#0f172a" text-anchor="start">A CI/CD pipeline</text>
<text x="32" y="72" font-size="14" font-weight="normal" fill="#475569" text-anchor="start">Every git push runs the same steps, in the same order, with no one typing commands.</text>
<polygon points="32,100 182,100 204,140 182,180 32,180" fill="#475569"/>
<text x="114.0" y="136" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Source</text>
<text x="114.0" y="158" font-size="12.5" font-weight="normal" fill="#ffffff" text-anchor="middle">git push</text>
<polygon points="212,100 362,100 384,140 362,180 212,180 234,140" fill="#0d9488"/>
<text x="304.0" y="136" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Build</text>
<text x="304.0" y="158" font-size="12.5" font-weight="normal" fill="#ffffff" text-anchor="middle">docker build</text>
<polygon points="392,100 542,100 564,140 542,180 392,180 414,140" fill="#7b1fa2"/>
<text x="484.0" y="136" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Test</text>
<text x="484.0" y="158" font-size="12.5" font-weight="normal" fill="#ffffff" text-anchor="middle">automated tests</text>
<polygon points="572,100 722,100 744,140 722,180 572,180 594,140" fill="#e37400"/>
<text x="664.0" y="136" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Package</text>
<text x="664.0" y="158" font-size="12.5" font-weight="normal" fill="#ffffff" text-anchor="middle">tagged image in</text>
<text x="664.0" y="174" font-size="12.5" font-weight="normal" fill="#ffffff" text-anchor="middle">Artifact Registry</text>
<polygon points="752,100 902,100 924,140 902,180 752,180 774,140" fill="#1a73e8"/>
<text x="844.0" y="136" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Deploy</text>
<text x="844.0" y="158" font-size="12.5" font-weight="normal" fill="#ffffff" text-anchor="middle">Cloud Run runs it</text>
<path d="M32,198 v10 h896 v-10" fill="none" stroke="#475569" stroke-width="2"/>
<text x="480" y="236" font-size="14" font-weight="bold" fill="#475569" text-anchor="middle">On Day 2, GitHub Actions runs all five on every push to main</text>
</g>
</svg>
