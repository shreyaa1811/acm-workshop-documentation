<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-label="Career roadmap for cloud and DevOps">
<title>Career roadmap for cloud and DevOps</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
  </marker>
</defs>
<rect x="1" y="1" width="958" height="338" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
<g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" fill="#0f172a">
<text x="32" y="46" font-size="22" font-weight="bold" fill="#0f172a" text-anchor="start">From here to a cloud or DevOps job</text>
<text x="32" y="72" font-size="14" font-weight="normal" fill="#475569" text-anchor="start">A typical path. You do not need all of it before your first role.</text>
<rect x="32" y="96" width="200" height="136" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<path d="M32,106 a10,10 0 0 1 10,-10 h180 a10,10 0 0 1 10,10 v30 h-200 z" fill="#475569"/>
<text x="46" y="122" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="start">1  Foundations</text>
<text x="46" y="162" font-size="14" font-weight="normal" fill="#0f172a" text-anchor="start">Linux command line</text>
<text x="46" y="186" font-size="14" font-weight="normal" fill="#0f172a" text-anchor="start">Networking basics</text>
<text x="46" y="210" font-size="14" font-weight="normal" fill="#0f172a" text-anchor="start">Git and GitHub</text>
<line x1="234" y1="164" x2="258" y2="164" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="262" y="96" width="200" height="136" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<path d="M262,106 a10,10 0 0 1 10,-10 h180 a10,10 0 0 1 10,10 v30 h-200 z" fill="#1a73e8"/>
<text x="276" y="122" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="start">2  Cloud</text>
<text x="276" y="162" font-size="14" font-weight="normal" fill="#0f172a" text-anchor="start">One provider, in depth</text>
<text x="276" y="186" font-size="14" font-weight="normal" fill="#0f172a" text-anchor="start">IAM, compute, storage</text>
<text x="276" y="210" font-size="14" font-weight="normal" fill="#0f172a" text-anchor="start">An entry-level cert</text>
<line x1="464" y1="164" x2="488" y2="164" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="492" y="96" width="200" height="136" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<path d="M492,106 a10,10 0 0 1 10,-10 h180 a10,10 0 0 1 10,10 v30 h-200 z" fill="#0d9488"/>
<text x="506" y="122" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="start">3  Containers</text>
<text x="506" y="162" font-size="14" font-weight="normal" fill="#0f172a" text-anchor="start">Docker</text>
<text x="506" y="186" font-size="14" font-weight="normal" fill="#0f172a" text-anchor="start">Registries and tags</text>
<text x="506" y="210" font-size="14" font-weight="normal" fill="#0f172a" text-anchor="start">Then Kubernetes</text>
<line x1="694" y1="164" x2="718" y2="164" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="722" y="96" width="200" height="136" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<path d="M722,106 a10,10 0 0 1 10,-10 h180 a10,10 0 0 1 10,10 v30 h-200 z" fill="#e37400"/>
<text x="736" y="122" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="start">4  Automate and operate</text>
<text x="736" y="162" font-size="14" font-weight="normal" fill="#0f172a" text-anchor="start">CI/CD pipelines</text>
<text x="736" y="186" font-size="14" font-weight="normal" fill="#0f172a" text-anchor="start">Terraform (IaC)</text>
<text x="736" y="210" font-size="14" font-weight="normal" fill="#0f172a" text-anchor="start">Monitoring, security</text>
<path d="M262,248 v10 h660 v-10" fill="none" stroke="#1a73e8" stroke-width="2"/>
<text x="592" y="280" font-size="14" font-weight="bold" fill="#1a73e8" text-anchor="middle">What this workshop covers (Day 1 and Day 2)</text>
<text x="32" y="318" font-size="14" font-weight="normal" fill="#475569" text-anchor="start">Roles: Cloud Engineer, DevOps Engineer, Site Reliability Engineer, Platform Engineer, Cloud Security Engineer</text>
</g>
</svg>
