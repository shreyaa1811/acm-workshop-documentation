<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-label="Virtual machines compared with containers">
<title>Virtual machines compared with containers</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
  </marker>
</defs>
<rect x="1" y="1" width="958" height="428" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
<g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" fill="#0f172a">
<text x="32" y="46" font-size="22" font-weight="bold" fill="#0f172a" text-anchor="start">Virtual machines vs containers</text>
<text x="32" y="72" font-size="14" font-weight="normal" fill="#475569" text-anchor="start">A container shares the host's kernel, so it skips the whole guest operating system.</text>
<text x="242" y="110" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="middle">Virtual machines</text>
<rect x="32" y="330" width="420" height="34" rx="6" fill="#475569" stroke="none" stroke-width="0"/>
<text x="242" y="352" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Hardware</text>
<rect x="32" y="290" width="420" height="34" rx="6" fill="#64748b" stroke="none" stroke-width="0"/>
<text x="242" y="312" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Hypervisor</text>
<rect x="32" y="250" width="130" height="34" rx="6" fill="#94a3b8" stroke="none" stroke-width="0"/>
<text x="97" y="272" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Libraries</text>
<rect x="32" y="210" width="130" height="34" rx="6" fill="#c5221f" stroke="none" stroke-width="0"/>
<text x="97" y="232" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Guest OS</text>
<rect x="32" y="170" width="130" height="34" rx="6" fill="#1a73e8" stroke="none" stroke-width="0"/>
<text x="97" y="192" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">App A</text>
<rect x="177" y="250" width="130" height="34" rx="6" fill="#94a3b8" stroke="none" stroke-width="0"/>
<text x="242" y="272" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Libraries</text>
<rect x="177" y="210" width="130" height="34" rx="6" fill="#c5221f" stroke="none" stroke-width="0"/>
<text x="242" y="232" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Guest OS</text>
<rect x="177" y="170" width="130" height="34" rx="6" fill="#1a73e8" stroke="none" stroke-width="0"/>
<text x="242" y="192" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">App B</text>
<rect x="322" y="250" width="130" height="34" rx="6" fill="#94a3b8" stroke="none" stroke-width="0"/>
<text x="387" y="272" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Libraries</text>
<rect x="322" y="210" width="130" height="34" rx="6" fill="#c5221f" stroke="none" stroke-width="0"/>
<text x="387" y="232" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Guest OS</text>
<rect x="322" y="170" width="130" height="34" rx="6" fill="#1a73e8" stroke="none" stroke-width="0"/>
<text x="387" y="192" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">App C</text>
<text x="242" y="396" font-size="14" font-weight="bold" fill="#475569" text-anchor="middle">Gigabytes each, boots in minutes</text>
<text x="718" y="110" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="middle">Containers</text>
<rect x="508" y="330" width="420" height="34" rx="6" fill="#475569" stroke="none" stroke-width="0"/>
<text x="718" y="352" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Hardware</text>
<rect x="508" y="290" width="420" height="34" rx="6" fill="#64748b" stroke="none" stroke-width="0"/>
<text x="718" y="312" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Host OS (one shared kernel)</text>
<rect x="508" y="250" width="420" height="34" rx="6" fill="#0d9488" stroke="none" stroke-width="0"/>
<text x="718" y="272" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Docker engine</text>
<rect x="508" y="210" width="130" height="34" rx="6" fill="#94a3b8" stroke="none" stroke-width="0"/>
<text x="573" y="232" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Libraries</text>
<rect x="508" y="170" width="130" height="34" rx="6" fill="#1a73e8" stroke="none" stroke-width="0"/>
<text x="573" y="192" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">App A</text>
<rect x="653" y="210" width="130" height="34" rx="6" fill="#94a3b8" stroke="none" stroke-width="0"/>
<text x="718" y="232" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Libraries</text>
<rect x="653" y="170" width="130" height="34" rx="6" fill="#1a73e8" stroke="none" stroke-width="0"/>
<text x="718" y="192" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">App B</text>
<rect x="798" y="210" width="130" height="34" rx="6" fill="#94a3b8" stroke="none" stroke-width="0"/>
<text x="863" y="232" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Libraries</text>
<rect x="798" y="170" width="130" height="34" rx="6" fill="#1a73e8" stroke="none" stroke-width="0"/>
<text x="863" y="192" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">App C</text>
<text x="718" y="396" font-size="14" font-weight="bold" fill="#475569" text-anchor="middle">Megabytes each, starts in seconds</text>
<line x1="480" y1="96" x2="480" y2="404" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>
</g>
</svg>
