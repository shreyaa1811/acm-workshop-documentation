<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-label="Career prospects: Containers">
<title>Career prospects: Containers</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
  </marker>
</defs>
<rect x="1" y="1" width="958" height="398" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
<g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" fill="#0f172a">
<text x="32" y="46" font-size="22" font-weight="bold" fill="#0f172a" text-anchor="start">Career prospects: Containers</text>
<text x="32" y="72" font-size="14" font-weight="normal" fill="#475569" text-anchor="start">Docker is the first step. Kubernetes is where most container jobs end up.</text>
<rect x="32" y="86" width="896" height="4" rx="2" fill="#0d9488"/>
<text x="32" y="122" font-size="13" font-weight="bold" fill="#0d9488" text-anchor="start">ROLES</text>
<rect x="32" y="134" width="440" height="66" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="32" y="134" width="6" height="66" rx="3" fill="#0d9488"/>
<text x="52" y="161" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="start">Platform Engineer</text>
<text x="52" y="184" font-size="13.5" font-weight="normal" fill="#475569" text-anchor="start">Builds the internal platform other developers ship on</text>
<rect x="32" y="210" width="440" height="66" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="32" y="210" width="6" height="66" rx="3" fill="#0d9488"/>
<text x="52" y="237" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="start">Kubernetes Administrator</text>
<text x="52" y="260" font-size="13.5" font-weight="normal" fill="#475569" text-anchor="start">Runs and secures clusters of containers in production</text>
<rect x="32" y="286" width="440" height="66" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="32" y="286" width="6" height="66" rx="3" fill="#0d9488"/>
<text x="52" y="313" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="start">Backend Developer</text>
<text x="52" y="336" font-size="13.5" font-weight="normal" fill="#475569" text-anchor="start">Ships services as containers; Docker is now a baseline skill</text>
<text x="504" y="122" font-size="13" font-weight="bold" fill="#0d9488" text-anchor="start">SKILLS EMPLOYERS ASK FOR</text>
<circle cx="510" cy="145" r="3.5" fill="#0d9488"/>
<text x="524" y="150" font-size="14" font-weight="normal" fill="#0f172a" text-anchor="start">Writing small, cache-friendly Dockerfiles</text>
<circle cx="510" cy="169" r="3.5" fill="#0d9488"/>
<text x="524" y="174" font-size="14" font-weight="normal" fill="#0f172a" text-anchor="start">Registries, tags and image versioning</text>
<circle cx="510" cy="193" r="3.5" fill="#0d9488"/>
<text x="524" y="198" font-size="14" font-weight="normal" fill="#0f172a" text-anchor="start">Kubernetes: pods, deployments, services</text>
<circle cx="510" cy="217" r="3.5" fill="#0d9488"/>
<text x="524" y="222" font-size="14" font-weight="normal" fill="#0f172a" text-anchor="start">Debugging with logs, ports and env vars</text>
<text x="504" y="260" font-size="13" font-weight="bold" fill="#0d9488" text-anchor="start">CERTIFICATIONS TO START WITH</text>
<circle cx="510" cy="283" r="3.5" fill="#0d9488"/>
<text x="524" y="288" font-size="14" font-weight="normal" fill="#0f172a" text-anchor="start">KCNA: Kubernetes and Cloud Native Associate</text>
<circle cx="510" cy="307" r="3.5" fill="#0d9488"/>
<text x="524" y="312" font-size="14" font-weight="normal" fill="#0f172a" text-anchor="start">CKAD: Certified Kubernetes Application Developer</text>
<circle cx="510" cy="331" r="3.5" fill="#0d9488"/>
<text x="524" y="336" font-size="14" font-weight="normal" fill="#0f172a" text-anchor="start">CKA: Certified Kubernetes Administrator</text>
<text x="32" y="380" font-size="13" font-weight="normal" fill="#475569" text-anchor="start" font-style="italic">Today you build and run one container. Kubernetes is what runs thousands of them.</text>
</g>
</svg>
