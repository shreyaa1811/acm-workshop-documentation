<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-label="One Dockerfile builds one image, which runs as many containers">
<title>One Dockerfile builds one image, which runs as many containers</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
  </marker>
</defs>
<rect x="1" y="1" width="958" height="298" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
<g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" fill="#0f172a">
<text x="32" y="46" font-size="22" font-weight="bold" fill="#0f172a" text-anchor="start">Dockerfile, image, container</text>
<text x="32" y="72" font-size="14" font-weight="normal" fill="#475569" text-anchor="start">Build once, run as many copies as you like. Image is the class, container is the object.</text>
<path d="M40,110 h120 l24,24 v120 h-144 z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<path d="M160,110 v24 h24" fill="none" stroke="#cbd5e1" stroke-width="2"/>
<text x="54" y="160" font-size="13" font-weight="normal" fill="#475569" text-anchor="start">FROM ...</text>
<text x="54" y="182" font-size="13" font-weight="normal" fill="#475569" text-anchor="start">COPY ...</text>
<text x="54" y="204" font-size="13" font-weight="normal" fill="#475569" text-anchor="start">RUN ...</text>
<text x="54" y="226" font-size="13" font-weight="normal" fill="#475569" text-anchor="start">CMD ...</text>
<text x="112" y="280" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Dockerfile</text>
<line x1="196" y1="182" x2="318" y2="182" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="257" y="172" font-size="13" font-weight="bold" fill="#0d9488" text-anchor="middle">docker build</text>
<rect x="322" y="122" width="190" height="120" rx="10" fill="#e6f4f1" stroke="#0d9488" stroke-width="2"/>
<text x="417" y="168" font-size="18" font-weight="bold" fill="#0d9488" text-anchor="middle">Image</text>
<text x="417" y="192" font-size="13" font-weight="normal" fill="#0f172a" text-anchor="middle">cloud-quest:v1</text>
<text x="417" y="212" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">read-only template</text>
<line x1="514" y1="182" x2="664" y2="126" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="668" y="100" width="250" height="52" rx="10" fill="#1a73e8" stroke="none" stroke-width="2"/>
<text x="688" y="132" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="start">Container 1</text>
<text x="900" y="132" font-size="13" font-weight="normal" fill="#dbe8fd" text-anchor="end">port 8080</text>
<line x1="514" y1="182" x2="664" y2="188" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="668" y="162" width="250" height="52" rx="10" fill="#1a73e8" stroke="none" stroke-width="2"/>
<text x="688" y="194" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="start">Container 2</text>
<text x="900" y="194" font-size="13" font-weight="normal" fill="#dbe8fd" text-anchor="end">port 8081</text>
<line x1="514" y1="182" x2="664" y2="250" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="668" y="224" width="250" height="52" rx="10" fill="#1a73e8" stroke="none" stroke-width="2"/>
<text x="688" y="256" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="start">Container 3</text>
<text x="900" y="256" font-size="13" font-weight="normal" fill="#dbe8fd" text-anchor="end">port 8082</text>
<text x="590" y="120" font-size="13" font-weight="bold" fill="#1a73e8" text-anchor="middle">docker run</text>
</g>
</svg>
